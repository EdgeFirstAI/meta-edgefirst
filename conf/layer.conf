# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend \
            ${LAYERDIR}/packagegroups/*.bb"

BBFILE_COLLECTIONS += "meta-edgefirst"
BBFILE_PATTERN_meta-edgefirst = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-edgefirst = "10"

LAYERDEPENDS_meta-edgefirst = "core openembedded-layer"
LAYERSERIES_COMPAT_meta-edgefirst = "scarthgap walnascar whinlatter wrynose"

# Include EdgeFirst -dev/-staticdev packages in the SDK toolchain
TOOLCHAIN_TARGET_TASK:append = " packagegroup-edgefirst-sdk"

# ConnMan is incompatible with the systemd-networkd stack this BSP
# ships: it grabs the /etc/resolv.conf update-alternatives slot whenever
# `systemd` is in DISTRO_FEATURES (see poky's connman.inc) and breaks
# DNS resolution on target. Fail the build if anything ever tries to
# pull ConnMan back into the image. The packagegroup-core-tools-testapps
# bbappend in this layer removes the only direct in-tree caller; this
# variable is the defence-in-depth guard for anything else.
PACKAGE_EXCLUDE:append = " connman connman-conf connman-client connman-tools connman-tests connman-gnome python3-pyconnman"
