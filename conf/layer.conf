# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend \
            ${LAYERDIR}/packagegroups/*.bb"

# Appends whose target recipe lives in an optional layer are only enabled
# when that layer is part of the build (collection:glob pairs).
BBFILES_DYNAMIC += "\
    imx-demo:${LAYERDIR}/dynamic-layers/imx-demo/recipes-*/*/*.bbappend \
    imx-machine-learning:${LAYERDIR}/dynamic-layers/imx-machine-learning/recipes-*/*/*.bbappend \
    fsl-bsp-release:${LAYERDIR}/dynamic-layers/fsl-bsp-release/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-edgefirst"
BBFILE_PATTERN_meta-edgefirst = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-edgefirst = "10"

LAYERDEPENDS_meta-edgefirst = "core openembedded-layer"
LAYERSERIES_COMPAT_meta-edgefirst = "scarthgap walnascar whinlatter wrynose"

# The i.MX 95 19x19 EVK boots a device tree that includes its camera sensor and
# the NEO ISP: without it libcamera lists no cameras. The kernel recipe builds
# this one, but the image only copies the device trees named here to the boot
# partition that U-Boot reads, so it has to be named as well. Selecting it takes
# fdtfile in the U-Boot environment.
IMAGE_BOOT_FILES:append:imx95-19x19-lpddr5-evk = " imx95-19x19-evk-os08a20-isp-adv7535.dtb"

# Include EdgeFirst -dev/-staticdev packages in the SDK toolchain
TOOLCHAIN_TARGET_TASK:append = " packagegroup-edgefirst-sdk"

# ConnMan is incompatible with the systemd-networkd stack this BSP
# ships: it grabs the /etc/resolv.conf update-alternatives slot whenever
# `systemd` is in DISTRO_FEATURES (see poky's connman.inc) and breaks
# DNS resolution on target. Fail the build if anything ever tries to
# pull ConnMan back into the image. The packagegroup-core-tools-testapps
# bbappend in this layer removes the only direct in-tree caller; this
# variable is the defence-in-depth guard for anything else.
PACKAGE_EXCLUDE:append = " connman connman-conf connman-client connman-tools connman-tests connman-gnome python3-pyconnman"

# Hold the Neutron NPU runtime at the SDK version this layer republishes.
# BitBake otherwise selects the highest PV, so a newer neutron recipe
# appearing in meta-imx would silently move the fetch back to NXP's git
# mirror and downgrade the firmware, with no build error to notice.
PREFERRED_VERSION_neutron = "3.2.3"

# Updating boards with apt is opt-in: a build sets EDGEFIRST_APT_FEED to 1 (in
# its site.conf or local.conf) to get the signed feed configuration, the
# release identity in os-release, the kernel packaging apt can update and the
# automatic-install marks. Without it none of that is applied, whatever else
# the build sets. The NXP i.MX builds turn it on; vendor stacks leave it off.
EDGEFIRST_APT_FEED ??= "0"

# EdgeFirst release identity, set from a vendor build's site.conf.
# EDGEFIRST_VERSION is YYYY.MM.PATCH: YYYY.MM names the quarterly release and
# PATCH counts the rolling updates published for it. A ~dev or ~rcN suffix marks
# a build ahead of the release and sorts below it. EDGEFIRST_FEED_BSP names the
# vendor BSP the release is built on, as <family>-<BSP version>; EDGEFIRST_VENDOR
# is the vendor's name as it reads in a title.
EDGEFIRST_VERSION ??= ""
EDGEFIRST_FEED_BSP ??= ""
EDGEFIRST_VENDOR ??= ""
EDGEFIRST_RELEASE = "${@'.'.join((d.getVar('EDGEFIRST_VERSION') or '').split('~')[0].split('.')[:2])}"
# The part of a package revision that makes a rebuilt package sort above the one
# it replaces: YYYYMM.PATCH of the release, so that 2026.10.1 sorts above
# 2026.10.0 and below 2027.01.0.
EDGEFIRST_VERSION_BASE = "${@(d.getVar('EDGEFIRST_VERSION') or '0.0.0').split('~')[0]}"
EDGEFIRST_REVISION = "${@''.join(d.getVar('EDGEFIRST_VERSION_BASE').split('.')[:2])}.${@d.getVar('EDGEFIRST_VERSION_BASE').split('.')[2]}"
EDGEFIRST_BSP_FAMILY = "${@(d.getVar('EDGEFIRST_FEED_BSP') or '').split('-', 1)[0]}"
EDGEFIRST_BSP_VERSION = "${@(d.getVar('EDGEFIRST_FEED_BSP') or '').split('-', 1)[-1]}"

INHERIT += "edgefirst-apt-image edgefirst-module-version"
